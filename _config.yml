title: "Karl Belanger's Portfolio"
description: "Linux Administration Projects, Accessibility Insights, and Homelab Engineering"
remote_theme: "mmistakes/minimal-mistakes@4.28.0"

head_scripts:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - /assets/js/mermaid-init.js

# Build settings
markdown: kramdown
highlighter: rouge

# Minimal Mistakes settings
plugins:
  - jekyll-include-cache

collections:
  Projects:
    output: true
    title: true

# Author info
author:
  name: "Karl Belanger"
  avatar: "/Karl -1 trimmed beard.jpg"
  bio: "Linux administrator building a home lab, writing about accessibility as a blind sysadmin."
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/karl-belanger-09761b21/"

# Defaults for all Markdown pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      toc: true
      toc_label: "On this page"
      toc_icon: "list"
      author_profile: true
